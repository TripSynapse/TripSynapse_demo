<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TripSynapse - Demo</title>
    <!-- Favicon -->
    <link rel="icon" href="logo.jpg" type="image/jpeg">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Import User Database -->
    <script src="users.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            dark: '#0f172a',
                            blue: '#00529B',
                            purple: '#9333EA',
                            orange: '#F97316',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .bg-gradient-brand {
            background: linear-gradient(90deg, #00529B 0%, #9333EA 50%, #F97316 100%);
        }

        .animate-fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Jetsetter Tab Styles */
        .jet-tab {
            padding-bottom: 0.5rem;
            border-bottom: 2px solid transparent;
            color: #94a3b8;
            /* slate-400 */
            font-weight: 500;
            transition: all 0.2s;
        }

        .jet-tab:hover {
            color: #475569;
            /* slate-600 */
        }

        .dark .jet-tab:hover {
            color: #cbd5e1;
            /* slate-300 */
        }

        .jet-tab.active {
            border-bottom: 2px solid #00529B;
            color: #00529B;
            font-weight: 600;
        }

        .dark .jet-tab.active {
            border-bottom: 2px solid #F97316;
            color: #F97316;
        }

        /* Stacked Bar Chart Animation */
        .bar-segment {
            transition: height 1s ease-out;
            height: 0;
        }

        .animate-fade-in .bar-segment {
            height: var(--target-height);
        }
    </style>
</head>

<body
    class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-white font-sans antialiased min-h-screen flex flex-col transition-colors duration-300">

    <!-- Navigation -->
    <nav
        class="w-full py-4 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between items-center">
            <a href="index.html" class="flex items-center space-x-3 group home-link">
                <img src="logo.jpg" onerror="this.src='https://placehold.co/100x100?text=Logo'" alt="TripSynapse Logo"
                    class="h-8 w-auto brand-logo transition-transform duration-300 group-hover:rotate-12">
                <span class="text-lg font-bold text-slate-900 dark:text-white tracking-tight">TripSynapse <span
                        class="text-xs bg-brand-orange text-white px-2 py-0.5 rounded-full ml-1">BETA</span></span>
            </a>

            <div class="flex items-center gap-3">
                <!-- Language Toggle -->
                <button onclick="toggleLanguage()"
                    class="flex items-center justify-center px-3 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 hover:border-brand-blue dark:hover:border-brand-orange transition-all bg-white dark:bg-slate-800 hover:shadow-sm">
                    <span id="lang-code" class="text-xs font-bold text-slate-700 dark:text-white">EN</span>
                </button>

                <!-- Theme Toggle -->
                <button onclick="toggleTheme()"
                    class="flex items-center justify-center p-2 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors"
                    title="Toggle Dark Mode">
                    <i class="fas fa-moon dark:hidden"></i>
                    <i class="fas fa-sun hidden dark:block text-yellow-400"></i>
                </button>

                <!-- Logout Button (Hidden by default) -->
                <button id="logout-btn" onclick="logout()"
                    class="hidden text-sm font-medium text-red-500 hover:text-red-600 transition-colors ml-2"
                    data-key="nav.logout">
                    Log out
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="flex-grow flex items-center justify-center p-4 relative">

        <!-- Background Elements -->
        <div class="absolute top-0 left-0 w-full h-full overflow-hidden -z-10">
            <div class="absolute top-10 left-10 w-72 h-72 bg-brand-blue/10 rounded-full blur-3xl"></div>
            <div class="absolute bottom-10 right-10 w-72 h-72 bg-brand-purple/10 rounded-full blur-3xl"></div>
        </div>

        <!-- VIEW 1: LOGIN FORM -->
        <div id="login-view"
            class="w-full max-w-md bg-white dark:bg-slate-900 rounded-2xl shadow-2xl border border-slate-200 dark:border-slate-800 p-8 animate-fade-in">
            <div class="text-center mb-6">
                <h1 class="text-2xl font-bold mb-2" data-key="login.title">Welcome Back</h1>
                <p class="text-slate-500 dark:text-slate-400 text-sm" data-key="login.subtitle">Please sign in to access
                    the Demo.</p>
            </div>

            <form id="login-form" onsubmit="handleLogin(event)" class="space-y-5">
                <!-- Username -->
                <div>
                    <label for="username" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2"
                        data-key="login.username">Username</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fas fa-user text-slate-400"></i>
                        </div>
                        <input type="text" id="username"
                            class="block w-full pl-10 pr-3 py-3 border border-slate-300 dark:border-slate-700 rounded-lg bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-brand-blue transition-all"
                            placeholder="Enter username" required>
                    </div>
                </div>

                <!-- Password -->
                <div>
                    <label for="password" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2"
                        data-key="login.password">Password</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fas fa-lock text-slate-400"></i>
                        </div>
                        <input type="password" id="password"
                            class="block w-full pl-10 pr-3 py-3 border border-slate-300 dark:border-slate-700 rounded-lg bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-brand-blue transition-all"
                            placeholder="Enter password" required>
                    </div>
                </div>

                <!-- Plan Selection -->
                <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-3"
                        data-key="login.selectPlan">Select Plan for Demo</label>
                    <div class="grid grid-cols-3 gap-2">
                        <!-- Explorer -->
                        <label class="cursor-pointer group">
                            <input type="radio" name="plan" value="Explorer" class="peer sr-only">
                            <div
                                class="rounded-xl border-2 border-slate-200 dark:border-slate-700 p-3 text-center transition-all hover:border-slate-400 peer-checked:border-slate-500 peer-checked:bg-slate-100 dark:peer-checked:bg-slate-800 dark:peer-checked:border-slate-400 peer-checked:shadow-inner opacity-60 peer-checked:opacity-100 hover:opacity-100">
                                <i class="fas fa-compass text-xl mb-2 text-slate-500"></i>
                                <div class="text-[10px] uppercase font-bold text-slate-700 dark:text-slate-300"
                                    data-key="plan.explorer">Explorer</div>
                            </div>
                        </label>

                        <!-- Standard -->
                        <label class="cursor-pointer group">
                            <input type="radio" name="plan" value="Standard" class="peer sr-only" checked>
                            <div
                                class="rounded-xl border-2 border-slate-200 dark:border-slate-700 p-3 text-center transition-all hover:border-brand-purple peer-checked:border-brand-purple peer-checked:bg-purple-50 dark:peer-checked:bg-purple-900/20 peer-checked:shadow-sm opacity-60 peer-checked:opacity-100 hover:opacity-100">
                                <i class="fas fa-plane text-xl mb-2 text-brand-purple"></i>
                                <div class="text-[10px] uppercase font-bold text-slate-700 dark:text-slate-300"
                                    data-key="plan.standard">Standard</div>
                            </div>
                        </label>

                        <!-- Jetsetter -->
                        <label class="cursor-pointer group">
                            <input type="radio" name="plan" value="Jetsetter" class="peer sr-only">
                            <div
                                class="rounded-xl border-2 border-slate-200 dark:border-slate-700 p-3 text-center transition-all hover:border-brand-blue peer-checked:border-brand-blue peer-checked:bg-blue-50 dark:peer-checked:bg-blue-900/20 peer-checked:shadow-sm opacity-60 peer-checked:opacity-100 hover:opacity-100">
                                <i class="fas fa-rocket text-xl mb-2 text-brand-blue"></i>
                                <div class="text-[10px] uppercase font-bold text-slate-700 dark:text-slate-300"
                                    data-key="plan.jetsetter">Jetsetter</div>
                            </div>
                        </label>
                    </div>
                </div>

                <div id="login-error"
                    class="hidden text-red-500 text-sm text-center bg-red-50 dark:bg-red-900/20 p-2 rounded-lg border border-red-100 dark:border-red-900"
                    data-key="login.error">
                    Invalid username or password.
                </div>

                <button type="submit"
                    class="w-full bg-gradient-brand text-white font-bold py-3 rounded-lg hover:opacity-90 transition-opacity shadow-lg shadow-brand-blue/20"
                    data-key="login.btn">
                    Sign In
                </button>
            </form>

            <div class="mt-6 text-center text-xs text-slate-400">
                <p data-key="login.hint">Try user: <strong>demo</strong> / pass: <strong>demoUser2025</strong></p>
            </div>
        </div>

        <!-- VIEW 2: APP DASHBOARD (Hidden by default) -->
        <div id="app-view" class="hidden w-full max-w-5xl animate-fade-in">
            <!-- Search Bar -->
            <div
                class="bg-white dark:bg-slate-900 p-6 rounded-2xl shadow-xl border border-slate-200 dark:border-slate-800 mb-8">

                <div class="flex justify-between items-center mb-4 flex-wrap gap-2">
                    <h2 class="text-xl font-bold" data-key="app.analyzeTitle">Find Your Hotel</h2>

                    <!-- Live Plan Switcher -->
                    <div class="flex items-center gap-2">
                        <label class="text-xs text-slate-500 font-medium">Current Mode:</label>
                        <select id="plan-switcher" onchange="switchPlan(this.value)"
                            class="text-xs font-bold uppercase tracking-wider bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 border border-slate-200 dark:border-slate-700 rounded-lg px-3 py-1.5 focus:outline-none focus:border-brand-blue">
                            <option value="Explorer">Explorer</option>
                            <option value="Standard">Standard</option>
                            <option value="Jetsetter">Jetsetter</option>
                        </select>
                    </div>
                </div>

                <div class="flex flex-col md:flex-row gap-4">
                    <div class="relative flex-grow">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-start pt-3 pointer-events-none">
                            <i class="fas fa-search text-slate-400"></i>
                        </div>
                        <input type="text" id="hotel-query"
                            class="block w-full pl-10 pr-3 py-3 border border-slate-300 dark:border-slate-700 rounded-lg bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-brand-purple"
                            placeholder="e.g., I'm travelling to Cluj and want a quiet hotel...">
                    </div>
                    <button onclick="simulateAnalysis()"
                        class="bg-gradient-brand text-white font-bold px-8 py-3 rounded-lg hover:opacity-90 transition-all shadow-lg flex items-center justify-center gap-2">
                        <i class="fas fa-magic"></i> <span data-key="app.analyzeBtn">Find</span>
                    </button>
                </div>
            </div>

            <!-- Loading State -->
            <div id="analysis-loader" class="hidden text-center py-12">
                <div
                    class="inline-block animate-spin rounded-full h-12 w-12 border-t-4 border-b-4 border-brand-orange mb-4">
                </div>
                <p class="text-lg font-medium text-slate-600 dark:text-slate-300 animate-pulse" data-key="app.loading">
                    Searching database & analyzing reviews...</p>
            </div>

            <!-- RESULT CARD CONTAINER -->
            <div id="result-card"
                class="hidden bg-white dark:bg-slate-900 rounded-2xl shadow-2xl border border-slate-200 dark:border-slate-800 overflow-hidden min-h-[400px]">
                <!-- Content injected via JS based on Plan -->
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer
        class="bg-slate-50 dark:bg-slate-950 py-6 border-t border-slate-200 dark:border-slate-800 text-center text-slate-500 text-xs">
        <p>&copy;
            <script>document.write(new Date().getFullYear())</script> TripSynapse. <span data-key="app.footer">Internal
                Demo Version 1.0</span>
        </p>
    </footer>

    <script>
        // --- 1. Theme Logic ---
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }

        function toggleTheme() {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.theme = 'light';
            } else {
                document.documentElement.classList.add('dark');
                localStorage.theme = 'dark';
            }
            updateLogo();
        }

        function updateLogo() {
            const isDark = document.documentElement.classList.contains('dark');
            const logo = document.querySelector('.brand-logo');
            if (logo) logo.src = isDark ? 'logo-dark.jpg' : 'logo.jpg';
        }
        updateLogo();

        // --- 2. Language Logic (Fixed Persistence) ---
        let currentLang = 'en';

        // Load language preference from session storage OR URL param
        const storedLang = sessionStorage.getItem('tripSynapseLang');
        const urlParams = new URLSearchParams(window.location.search);

        if (urlParams.get('lang') === 'ro') {
            currentLang = 'ro';
            sessionStorage.setItem('tripSynapseLang', 'ro');
        } else if (storedLang) {
            currentLang = storedLang;
        }

        const translations = {
            en: {
                "nav.logout": "Log out",
                "login.title": "Welcome Back",
                "login.subtitle": "Please sign in to access the Demo.",
                "login.username": "Username",
                "login.password": "Password",
                "login.selectPlan": "Select Plan for Demo",
                "plan.explorer": "Explorer",
                "plan.standard": "Standard",
                "plan.jetsetter": "Jetsetter",
                "login.btn": "Sign In",
                "login.error": "Invalid username or password.",
                "login.hint": "Try user: <strong>demo</strong> / pass: <strong>demoUser2025</strong>",
                "app.analyzeTitle": "Find Your Hotel",
                "app.placeholder": "e.g., I'm travelling to Cluj and want a quiet hotel...",
                "app.analyzeBtn": "Find",
                "app.loading": "Searching database & analyzing reviews...",
                "app.trustScore": "Trust Score",
                "app.aiSummaryTitle": "AI Summary",
                "app.pros": "Pros",
                "app.cons": "Cons",
                "app.footer": "Internal Demo Version 1.0",
                "jet.tabDeep": "Deep Analysis",
                "jet.tabCross": "Cross-Platform Insights",
                "jet.tabScam": "Scam Detection"
            },
            ro: {
                "nav.logout": "Deconectare",
                "login.title": "Bine ai revenit",
                "login.subtitle": "Te rugăm să te autentifici pentru a accesa Demo-ul.",
                "login.username": "Nume utilizator",
                "login.password": "Parola",
                "login.selectPlan": "Selectează Planul Demo",
                "plan.explorer": "Explorator",
                "plan.standard": "Standard",
                "plan.jetsetter": "Jetsetter",
                "login.btn": "Autentificare",
                "login.error": "Nume de utilizator sau parolă invalidă.",
                "login.hint": "Încearcă user: <strong>demo</strong> / parolă: <strong>demoUser2025</strong>",
                "app.analyzeTitle": "Găsește Hotelul Tău",
                "app.placeholder": "ex: Călătoresc la Cluj și vreau un hotel liniștit...",
                "app.analyzeBtn": "Caută",
                "app.loading": "Căutăm în bază și analizăm recenziile...",
                "app.trustScore": "Scor Încredere",
                "app.aiSummaryTitle": "Rezumat AI",
                "app.pros": "Pro",
                "app.cons": "Contra",
                "app.footer": "Versiune Demo Internă 1.0",
                "jet.tabDeep": "Analiză Detaliată",
                "jet.tabCross": "Date Multi-Platformă",
                "jet.tabScam": "Detectare Înșelătorii"
            }
        };

        function updateUI() {
            const code = currentLang === 'en' ? 'EN' : 'RO';
            document.getElementById('lang-code').innerText = code;

            const elements = document.querySelectorAll('[data-key]');
            elements.forEach(el => {
                const key = el.getAttribute('data-key');
                if (translations[currentLang][key]) {
                    el.innerHTML = translations[currentLang][key];
                }
            });

            // Update placeholder
            document.getElementById('hotel-query').placeholder = translations[currentLang]["app.placeholder"];

            // Update links to keep language
            const homeLink = document.querySelector('.home-link');
            if (homeLink) {
                const base = homeLink.getAttribute('href').split('?')[0];
                homeLink.href = `${base}?lang=${currentLang}`;
            }

            // Sync Plan Switcher
            const storedPlan = sessionStorage.getItem('tripSynapsePlan');
            if (storedPlan) {
                document.getElementById('plan-switcher').value = storedPlan;
            }
        }

        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'ro' : 'en';
            sessionStorage.setItem('tripSynapseLang', currentLang);
            updateUI();

            // Re-render dashboard if visible
            const resultCard = document.getElementById('result-card');
            if (!resultCard.classList.contains('hidden') && currentResultData) {
                // If we have data loaded, just re-render with new language immediately
                const plan = sessionStorage.getItem('tripSynapsePlan') || 'Standard';
                if (plan === 'Explorer') renderExplorer(currentResultData, currentLang);
                else if (plan === 'Jetsetter') renderJetsetter(currentResultData, currentLang);
                else renderStandard(currentResultData, currentLang);
            }
        }

        // Initialize
        updateUI();


        // --- 3. Login Logic ---
        function handleLogin(e) {
            e.preventDefault();

            const userIn = document.getElementById('username').value;
            const passIn = document.getElementById('password').value;
            // Get selected radio value
            const planIn = document.querySelector('input[name="plan"]:checked').value;

            const errorMsg = document.getElementById('login-error');

            if (typeof VALID_USERS === 'undefined') {
                alert("Error: Database file users.js not found!");
                return;
            }

            const validUser = VALID_USERS.find(u => u.username === userIn && u.password === passIn);

            if (validUser) {
                errorMsg.classList.add('hidden');
                document.getElementById('login-view').classList.add('hidden');
                document.getElementById('app-view').classList.remove('hidden');
                document.getElementById('logout-btn').classList.remove('hidden');

                sessionStorage.setItem('tripSynapseUser', validUser.name);
                sessionStorage.setItem('tripSynapsePlan', planIn);

                updateUI(); // Refresh UI
            } else {
                errorMsg.classList.remove('hidden');
                const form = document.getElementById('login-view');
                form.classList.add('animate-pulse');
                setTimeout(() => form.classList.remove('animate-pulse'), 500);
            }
        }

        function logout() {
            sessionStorage.removeItem('tripSynapseUser');
            sessionStorage.removeItem('tripSynapsePlan');
            sessionStorage.removeItem('tripSynapseLang');
            location.reload();
        }

        function switchPlan(newPlan) {
            sessionStorage.setItem('tripSynapsePlan', newPlan);
            // If we have a result already showing, re-render it with new plan
            const resultCard = document.getElementById('result-card');
            if (!resultCard.classList.contains('hidden')) {
                // Re-render without full loading simulation for snappiness
                const plan = newPlan;
                const lang = currentLang;
                if (plan === 'Explorer') renderExplorer(currentResultData, lang);
                else if (plan === 'Jetsetter') renderJetsetter(currentResultData, lang);
                else renderStandard(currentResultData, lang);
            }
        }

        window.onload = function () {
            const user = sessionStorage.getItem('tripSynapseUser');
            if (user) {
                document.getElementById('login-view').classList.add('hidden');
                document.getElementById('app-view').classList.remove('hidden');
                document.getElementById('logout-btn').classList.remove('hidden');
            }
            updateUI();
        }

        // --- 4. App Simulation Logic & Data ---

        let currentResultData = null; // Store for re-rendering

        const MOCK_DATA = {
            bucharest: {
                name: "Grand Hotel Continental",
                location: { en: "Bucharest, Romania", ro: "București, România" },

                    ro: "O alegere solidă pentru iubitorii de istorie. Locația este imbatabilă, chiar în inima Bucureștiului. Oaspeții laudă constant varietatea micului dejun și politețea personalului. Totuși, rețineți că parcarea este destul de scumpă (€25/zi) iar sala de sport este foarte basic."
                },
                pros: {
                    en: ["Excellent central location", "Beautiful historic architecture", "High quality breakfast"],
                    ro: ["Locație centrală excelentă", "Arhitectură istorică frumoasă", "Mic dejun de înaltă calitate"]
                },
                cons: {
                    en: ["Expensive parking fees", "Gym is small and outdated", "Some street noise on lower floors"],
                    ro: ["Taxe de parcare scumpe", "Sala de sport mică și învechită", "Zgomot stradal la etajele inferioare"]
                },
                details: {
                    scores: { clean: 9.2, service: 8.9, noise: 7.5, amenities: 6.8 },
                    scamPassed: true, // Passed checks
                    risks: { en: ["Authenticity confirmed"], ro: ["Autenticitate confirmată"] }, // Used if passed
                    reviewsData: [{ p: 80, n: 5 }, { p: 85, n: 4 }, { p: 90, n: 3 }, { p: 88, n: 6 }] // Q1-Q4 pos/neg values
                }
            },
            cluj: {
                name: "Hotel Platinia",
                location: { en: "Cluj-Napoca, Romania", ro: "Cluj-Napoca, România" },
                reviews: 890,
                score: 9.4,
                shortSummary: {
                    en: "Luxury suites near stadium, great breakfast, can be noisy due to traffic.",
                    ro: "Suite de lux lângă stadion, mic dejun bun, poate fi zgomotos din cauza traficului."
                },
                summary: {
                    en: "An excellent modern luxury hotel. Travelers love the spacious suites and the proximity to the city center and stadium. The breakfast is considered one of the best in Cluj. The only minor complaint is the traffic in the area during peak hours.",

                },
                pros: {
                    en: ["Modern & Spacious Suites", "Outstanding Breakfast", "Great location near Arena"],
                    ro: ["Suite Moderne și Spațioase", "Mic Dejun Excepțional", "Locație bună lângă Arenă"]
                },
                cons: {
                    en: ["Traffic noise during rush hour", "Pricey during events"],
                    ro: ["Zgomot de trafic la orele de vârf", "Scump în timpul evenimentelor"]
                },
                details: {

        function simulateAnalysis() {
            const input = document.getElementById('hotel-query');
            if (!input.value) {
                input.focus();
                return;
            }

            const query = input.value.toLowerCase();
            let data = MOCK_DATA.bucharest;
            if (query.includes("cluj")) {
                data = MOCK_DATA.cluj;
            } else if (query.includes("brasov") || query.includes("brașov")) {
                data = MOCK_DATA.brasov;
            }

            currentResultData = data; // Save for toggling

            const loader = document.getElementById('analysis-loader');
            const resultCard = document.getElementById('result-card');

            resultCard.classList.add('hidden');
            loader.classList.remove('hidden');

            setTimeout(() => {
                loader.classList.add('hidden');

                const plan = sessionStorage.getItem('tripSynapsePlan') || 'Standard';
                const lang = currentLang;

                if (plan === 'Explorer') {
                    renderExplorer(data, lang);
                } else if (plan === 'Jetsetter') {
                    renderJetsetter(data, lang);
                } else {
                    renderStandard(data, lang);
                }

                resultCard.classList.remove('hidden');
                resultCard.classList.add('animate-fade-in');
            }, 1500);
        }

        // --- RENDERERS ---

                    <div>

        // Global function to handle tab switching
        window.switchJetTab = function (tabName) {
            const tabs = document.querySelectorAll('.jet-tab');
            const contents = document.querySelectorAll('.jet-content');

            tabs.forEach(t => t.classList.remove('active', 'text-brand-blue', 'dark:text-brand-orange'));
            tabs.forEach(t => {
                if (t.dataset.tab === tabName) {
                    t.classList.add('active');
                } else {
                    t.classList.add('text-slate-400'); // Reset non-active
                }
            });

            contents.forEach(c => c.classList.add('hidden'));
            document.getElementById(`jet-${tabName}`).classList.remove('hidden');
        };

        function renderJetsetter(data, lang) {
            // Helper for progress bars
            const bar = (val, color) => `
                <div class="mb-4">
                    <div class="flex justify-between text-xs font-bold mb-1 text-slate-600 dark:text-slate-300">

                    <div class="w-full bg-slate-200 dark:bg-slate-700 rounded-full h-2.5">

            // Build Alerts
            let alertHtml = '';

                // Success State
                alertHtml = data.details.risks[lang].map(r => `

            // data.details.reviewsData = [{p:90, n:5}, ...]

                // Scale heights to max 100%

                chartHtml += `
                    <div class="flex flex-col items-center w-1/4 h-full justify-end group relative">
                        <!-- Tooltip -->
                        <div class="absolute -top-8 bg-slate-800 text-white text-[10px] px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap z-10">
                            +${q.p} / -${q.n}
                        </div>
                        
                        <!-- Positive Bar -->
                        <div class="w-full bg-green-400 dark:bg-green-500 rounded-t-sm bar-segment" style="--target-height: ${hP}%"></div>
                        <!-- Negative Bar -->
                        <div class="w-full bg-red-400 dark:bg-red-500 mt-1 rounded-b-sm bar-segment" style="--target-height: ${hN}%"></div>
                        
                        <div class="text-[10px] text-slate-400 mt-2 font-bold">${quarters[idx]}</div>
                    </div>
                `;
            });
            chartHtml += `</div>`;

            // Standard View Content (Re-used for the Cross-Platform Tab)
            let prosHtml = data.pros[lang].map(p => `<li class="flex items-start"><i class="fas fa-check text-green-500 mt-1 mr-2"></i> ${p}</li>`).join('');

                </div>

                <!-- TAB CONTENT: DEEP ANALYSIS -->
                <div id="jet-deep" class="jet-content p-6 bg-white dark:bg-slate-900 grid md:grid-cols-3 gap-6">
                    <!-- Weighted Scoring -->
                    <div class="bg-slate-50 dark:bg-slate-800 p-4 rounded-xl border border-slate-100 dark:border-slate-700">

                    <!-- Review Heatmaps -->
                    <div class="bg-slate-50 dark:bg-slate-800 p-4 rounded-xl border border-slate-100 dark:border-slate-700">

                    </div>
                </div>

                <!-- TAB CONTENT: CROSS PLATFORM (Standard View) -->
                <div id="jet-cross" class="jet-content hidden p-6 bg-white dark:bg-slate-900">
                     <h4 class="text-lg font-bold mb-4">Aggregated Summary (Standard View)</h4>
                     <div class="bg-slate-50 dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700">
                        ${standardContent}
                     </div>
                </div>

                <!-- TAB CONTENT: SCAM DETECTION -->
                <div id="jet-scam" class="jet-content hidden p-6 bg-white dark:bg-slate-900">
                    <div class="flex items-center gap-4 mb-6">
                        <div class="w-16 h-16 rounded-full flex items-center justify-center bg-${data.details.scamPassed ? 'green' : 'red'}-100 dark:bg-${data.details.scamPassed ? 'green' : 'red'}-900/30">
                            <i class="fas fa-${data.details.scamPassed ? 'shield-alt' : 'exclamation-triangle'} text-2xl text-${data.details.scamPassed ? 'green' : 'red'}-600"></i>
                        </div>
                        <div>
                            <h3 class="text-xl font-bold text-slate-900 dark:text-white">${data.details.scamPassed ? 'Listing Verified Safe' : 'Listing Flagged as Unsafe'}</h3>

                    </div>

                    <div class="space-y-4">
                        <!-- Check 1 -->
                        <div class="flex justify-between items-center p-4 border border-slate-100 dark:border-slate-800 rounded-lg">

                            </div>
                            <span class="text-xs font-bold px-2 py-1 rounded bg-${data.details.scamPassed ? 'green' : 'red'}-100 text-${data.details.scamPassed ? 'green' : 'red'}-700">${data.details.scamPassed ? 'PASSED' : 'FAILED (Stock Photos)'}</span>
                        </div>
                        <!-- Check 2 -->
                        <div class="flex justify-between items-center p-4 border border-slate-100 dark:border-slate-800 rounded-lg">
                            <div class="flex items-center gap-3">
                                <i class="fas fa-users text-slate-400"></i>
                                <span class="text-sm font-medium">Review Burst Patterns</span>

                        </div>
                        <!-- Check 3 -->

                        </div>

            document.getElementById('result-card').innerHTML = html;
        }

    </script>
